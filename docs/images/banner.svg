<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#303F9F"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <rect width="900" height="200" rx="12" fill="url(#grid)"/>
  <!-- Bar chart / statistics icon -->
  <g transform="translate(70, 45)">
    <!-- Axes -->
    <line x1="10" y1="10" x2="10" y2="100" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="100" x2="120" y2="100" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bars -->
    <rect x="20" y="65" width="14" height="35" rx="2" fill="#7986CB" opacity="0.9"/>
    <rect x="40" y="40" width="14" height="60" rx="2" fill="#9FA8DA" opacity="0.9"/>
    <rect x="60" y="25" width="14" height="75" rx="2" fill="#7986CB" opacity="0.9"/>
    <rect x="80" y="50" width="14" height="50" rx="2" fill="#9FA8DA" opacity="0.9"/>
    <rect x="100" y="15" width="14" height="85" rx="2" fill="#C5CAE9" opacity="0.9"/>
    <!-- Trend line -->
    <polyline points="27,60 47,35 67,20 87,45 107,10" fill="none" stroke="#E8EAF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dots on trend line -->
    <circle cx="27" cy="60" r="3" fill="#E8EAF6"/>
    <circle cx="47" cy="35" r="3" fill="#E8EAF6"/>
    <circle cx="67" cy="20" r="3" fill="#E8EAF6"/>
    <circle cx="87" cy="45" r="3" fill="#E8EAF6"/>
    <circle cx="107" cy="10" r="3" fill="#E8EAF6"/>
  </g>
  <!-- Title -->
  <text x="310" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="white">StatiX</text>
  <!-- Subtitle -->
  <text x="310" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">ISP network statistics and monitoring dashboard</text>
</svg>
